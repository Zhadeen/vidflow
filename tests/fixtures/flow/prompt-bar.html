<header>
  <button aria-label="Account details">PRO</button>
  <button aria-label="Google Account: Owner  &#10;(owner@example.com), Google membership"></button>
</header>
<flow-base-prompt-box>
  <flow-rich-text-editor>
    <span aria-hidden="true">What do you want to create?</span>
    <div><div role="textbox" aria-multiline="true" aria-label="What do you want to create?" contenteditable="true" translate="no"><p><br></p></div></div>
  </flow-rich-text-editor>
  <button type="button" aria-haspopup="true" aria-label="Add ingredients to the prompt box">add</button>
  <button type="button" class="agent-mode-chip" aria-pressed="false">Agent</button>
  <button type="button" aria-label="Settings trigger">🍌 Nano Banana 2.1<br>crop_9_16<br>x2</button>
  <button type="submit" aria-label="Start generation" disabled>arrow_forward</button>
</flow-base-prompt-box>

  <div role="radiogroup"><button role="radio" aria-checked="true">image Image</button><button role="radio" aria-checked="false">videocam Video</button></div>
  <div role="radiogroup">
    <button role="radio" aria-checked="false">crop_16_9 16:9</button><button role="radio" aria-checked="false">crop_landscape 4:3</button><button role="radio" aria-checked="false">crop_square 1:1</button><button role="radio" aria-checked="false">crop_portrait 3:4</button><button role="radio" aria-checked="true">crop_9_16 9:16</button>
  </div>
  <button>🍌 Nano Banana 2.1</button>
  <div role="radiogroup"><button role="radio" aria-checked="false">x1</button><button role="radio" aria-checked="true">x2</button><button role="radio" aria-checked="false">x3</button><button role="radio" aria-checked="false">x4</button></div>
  <div>Generating will use <a>0 credits</a></div>
</div>
