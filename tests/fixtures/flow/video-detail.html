<!--
  Hand-built from spike S8: a clip's page /u/0/project/<project>/edit/<editId> — a video editor (canvas player,
  timeline), the prompt in flow-expandable-prompt div.prompt-text span.text-part, and toolbar buttons incl.
  [aria-label="Download media"], which opens a role="menu" of role="menuitem" choices.
-->
<div class="video-editor">
  <header>
    <button aria-label="Back"><mat-icon>arrow_back</mat-icon></button>
    <button aria-label="Download media"><mat-icon>download</mat-icon></button>
  </header>
  <!-- Recorded live 6 Nov: Flow's media rail lists the project's items (the clip and the uploads, by name). -->
  <div class="virtual-scroll-items">
    <flow-navigation-rail-thumbnail><button class="thumbnail-button"><img alt="" src="data:," /><span>Stickman waving</span></button></flow-navigation-rail-thumbnail>
    <flow-navigation-rail-thumbnail><button class="thumbnail-button"><img alt="" src="data:," /><span>vidflow-s01.png</span></button></flow-navigation-rail-thumbnail>
    <flow-navigation-rail-thumbnail><button class="thumbnail-button"><img alt="" src="data:," /><span>vidflow-s02.png</span></button></flow-navigation-rail-thumbnail>
  </div>
  <!-- The clip's own start frame: an ingredient chip with no name. -->
  <div class="ingredients-list">
    <flow-image-ingredient-chip><button class="chip-container" aria-label="Ingredient"><img alt="Ingredient image" src="data:," /></button></flow-image-ingredient-chip>
  </div>
  <canvas class="player"></canvas>
  <div class="timeline"><span>00:04:00</span></div>
  <flow-expandable-prompt>
    <div class="prompt-text"><span class="text-part">The stickman waves hello. Keep the exact same drawing style
      and characters as the start frame.</span></div>
  </flow-expandable-prompt>
</div>
