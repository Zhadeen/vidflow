<!--
  Built from spike S8 ("Flow announcements", 5 Nov 2026): a "What's new" announcement over the page with "View all
  changelogs" and "Get started". Not a policy notice and not billing: VidFlow closes it with "Get started" and carries
  on. Its wording may mention plans ("for Ultra subscribers"), which must not make it a billing dialog. Markup not
  captured; the text and buttons are as recorded.
-->
<div class="cdk-overlay-container">
  <div class="cdk-overlay-pane">
    <mat-dialog-container role="dialog" aria-modal="true" class="announcement">
      <span>What's new</span>
      <h2>Introducing Omni 1.2!</h2>
      <p>Video lengths up to 15 s, rolling out over the next few weeks, first for Ultra subscribers.</p>
      <button class="changelogs">View all changelogs</button>
      <button class="get-started">Get started</button>
    </mat-dialog-container>
  </div>
</div>
