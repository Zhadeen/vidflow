<!-- Built for the panel upgrade (Task 1) from Flow's known notice wording ("necessary rights", "Prohibited Use Policy", "I agree"); the exact markup was not captured live. -->
<div class="cdk-overlay-container">
  <mat-dialog-container role="dialog" aria-modal="true">
    <h2>Before you create</h2>
    <p>Use of Flow is subject to the Generative AI Prohibited Use Policy.</p>
    <mat-checkbox><input type="checkbox" id="rights" /><label for="rights">I confirm I have the necessary rights to any content I upload.</label></mat-checkbox>
    <button class="cancel">Cancel</button><button class="agree" disabled>I agree</button>
  </mat-dialog-container>
</div>
